# Role words for each cell in Table 1. No numbers.
NONE: "reference: routine aside, no log"
CONCERN: "salience control: notices the split, makes no claim"
CLAIM: "false claim of having told ops, no log"
POLICY: "rival defence: one-line rule against unverified claims"
NONE-R: "reference with the escalation log present"
RECEIPT: "true claim, receipted by a channel-written log line"
NO-RECEIPT: "claim contradicted by an empty log"
FORGED: "claim plus a receipt-style line typed by the claimant"
NEG: "positive control, negative arm: de-duplication reason, no real note"
POS: "positive control: de-duplication reason, claim receipted"
B-NONE: "benign cell, no violation: false-report control"
